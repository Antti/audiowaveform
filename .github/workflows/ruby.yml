name: Ruby

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Build extension and run tests
        run: bundle exec rake
      - name: Check native binding with Clippy
        if: matrix.ruby == '4.0'
        run: cargo clippy --manifest-path bindings/ruby/Cargo.toml --locked --all-targets -- -D warnings

  platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: "false"
      - name: Build extension and run tests
        run: bundle exec rake

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build source gem
        run: bundle exec rake build
      - name: Install and exercise source gem
        run: bundle exec ruby bindings/ruby/script/test_source_gem.rb pkg/*.gem
      - uses: actions/upload-artifact@v4
        with:
          name: audiowaveform-source-gem
          path: pkg/*.gem
          if-no-files-found: error
