name: Ruby Gem Release

on:
  push:
    tags:
      - "ruby-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruby-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "ruby-v$(ruby -Ibindings/ruby/lib -raudiowaveform/version -e 'print AudioWaveform::VERSION')"

  test:
    needs: validate
    uses: ./.github/workflows/ruby.yml

  native:
    needs: validate
    uses: ./.github/workflows/ruby-native.yml

  publish:
    # Manual runs build and test artifacts without publishing, even on a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ruby-v')
    needs: [test, native]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@v4
        with:
          pattern: audiowaveform-*
          merge-multiple: true
          path: pkg
      - name: Verify the complete release
        run: ruby bindings/ruby/script/check_release.rb pkg
      - name: Authenticate with RubyGems Trusted Publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish source and platform gems
        run: ruby bindings/ruby/script/publish_gems.rb pkg
      - name: Attach gems to GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" pkg/*.gem --clobber
          else
            gh release create "$GITHUB_REF_NAME" pkg/*.gem --generate-notes --title "$GITHUB_REF_NAME" --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
